name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/github-pages-setup-q5iw4q
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Tillåt bara en samtidig deploy
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publicerar hela repo-roten (där index.html ligger)
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
